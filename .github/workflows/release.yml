name: release

# A release is cut by pushing a tag. The build runs here so it does not depend on
# anyone's machine. Publishing to a downstream package repository stays manual, so
# no host or credential of one is ever present in this public repository.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version.py matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep __version__ luadox/version.py | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version.py ($version)" >&2
            exit 1
          fi
          echo "building luadox $version"

      - name: Build
        run: make release

      - name: Check the archives
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -f "build/luadox-$v.zip"
          test -f "build/luadox-$v.tar.gz"
          # The second zip exists so a consumer unpacking into a shared tools directory
          # does not have to repack it, so check it really carries that layout.
          python3 -c "import sys,zipfile; n=zipfile.ZipFile(sys.argv[1]).namelist(); assert 'luadox/luadox' in n, n; assert all(x.startswith('luadox/') for x in n), n; print('tooldir archive ok:', n)" "build/luadox-$v-tooldir.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/luadox-*.zip build/luadox-*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
